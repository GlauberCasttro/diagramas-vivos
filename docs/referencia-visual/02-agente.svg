<text class="desc" x="906" y="204">Busca, leitura de arquivos e execução de</text>
<text class="desc" x="906" y="223">comandos.</text>
<rect x="906" y="236" width="42" height="21" rx="10.5" fill="rgb(0,0,0)" fill-opacity=".05"/><text class="meta" x="914" y="250.5">MCP</text>
<rect x="888" y="135" width="300" height="138" rx="20" fill="none" stroke="#c06a1d" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="m2.end"/></rect>
</g>
<g id="n-memoria">
