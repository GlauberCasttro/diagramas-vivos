<rect x="906" y="325" width="30" height="30" rx="10" fill="#0f8a76" fill-opacity=".13"/>
<path transform="translate(906,325)" d="M9 10.5c0-3 12-3 12 0v9c0 3-12 3-12 0z M9 10.5c0 3 12 3 12 0" fill="none" stroke="#0f8a76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="nome" x="946" y="345">Memória</text>
<text class="desc" x="906" y="378">Guarda fatos e resultados entre os</text>
<text class="desc" x="906" y="397">passos.</text>
<rect x="888" y="309" width="300" height="109" rx="20" fill="none" stroke="#0f8a76" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="m4.end"/></rect>
</g>
<g id="n-revisor">
<rect class="card prop" x="888" y="454" width="300" height="90" rx="20" stroke="#595959" stroke-width="1"/>
<rect x="906" y="470" width="30" height="30" rx="10" fill="#c43c86" fill-opacity=".13"/>
<path transform="translate(906,470)" d="M12.5 8h5 M13.5 8v5l-4 8.5h11L16.5 13V8" fill="none" stroke="#c43c86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="nome" x="946" y="490">Revisor</text>
<text class="desc" x="906" y="523">Confere a resposta antes de entregar.</text>
<rect x="888" y="454" width="300" height="90" rx="20" fill="none" stroke="#c43c86" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="m6.end"/></rect>
</g>
</g>
<g id="portas">
<rect x="382.4" y="229" width="51.2" height="18" rx="6" fill="#f3f3f1"/><text class="rot" x="408" y="242" text-anchor="middle" fill="#6a45d6">pedido</text>
<g stroke="#6a45d6"><circle class="port" cx="348" cy="238" r="3.4"/><circle class="port" cx="468" cy="238" r="3.4"/></g>
