<g stroke="#6a45d6"><path class="trace" style="stroke-opacity:.9" d="M48,592 L76,592"/><circle class="port" cx="48" cy="592" r="3.4"/><circle class="port" cx="76" cy="592" r="3.4"/></g>
<text class="leg" x="86" y="596">chamada</text>
<g stroke="#4450cf"><path class="trace" style="stroke-opacity:.9" d="M165.12,592 L193.12,592"/><circle class="port" cx="165.12" cy="592" r="3.4"/><circle class="port" cx="193.12" cy="592" r="3.4"/></g>
<text class="leg" x="203.1" y="596">RPC</text>
<g stroke="#0b7f6b"><path class="trace" style="stroke-opacity:.9" d="M255.6,592 L283.6,592"/><circle class="port" cx="255.6" cy="592" r="3.4"/><circle class="port" cx="283.6" cy="592" r="3.4"/></g>
<text class="leg" x="293.6" y="596">dados</text>
