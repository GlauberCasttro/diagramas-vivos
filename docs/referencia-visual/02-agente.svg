<text class="desc" x="66" y="262">Faz o pedido em linguagem natural.</text>
<rect x="48" y="193" width="300" height="90" rx="20" fill="none" stroke="#1f7ac4" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="m1.begin;m5.begin"/></rect>
</g>
<g id="n-planejador">
<rect class="card" x="468" y="183" width="300" height="109" rx="20"/>
<rect x="486" y="199" width="30" height="30" rx="10" fill="#7a5ad8" fill-opacity=".13"/>
<path transform="translate(486,199)" d="M8 8h14v5H8z M8 17h14v5H8z" fill="none" stroke="#7a5ad8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text class="nome" x="526" y="219">Planejador</text>
<text class="desc" x="486" y="252">Decide o próximo passo: responder ou</text>
<text class="desc" x="486" y="271">chamar uma ferramenta.</text>
<rect x="468" y="183" width="300" height="109" rx="20" fill="none" stroke="#7a5ad8" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="m1.end;m3.end;m5.end"/></rect>
</g>
<g id="n-ferramentas">
