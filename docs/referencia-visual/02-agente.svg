<svg viewBox="0 0 1236 710" width="1236" height="710" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Agente com ferramentas e memória</title>
<desc id="d">Referência visual escolhida pelo dono (2026-11-18). Um pedido do usuário passa pelo planejador, usa ferramentas e volta como resposta. Cenários: Pedido com uso de ferramenta; Resposta revisada.</desc>
<!-- visual derivado do floorplan (MIT) (c) 2026 Hayden Smith -->
<style>
  .titulo{fill:#161616;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .subt{fill:#3f3f3f;font-size:13px}
  .card{fill:#ffffff;stroke:rgba(0,0,0,.1);stroke-width:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12))}
  .ext{fill:none;stroke:rgba(0,0,0,.18);stroke-width:1.5}
  .prop{stroke-dasharray:6 5}
  .nome{fill:#161616;font-size:15px;font-weight:600;letter-spacing:-.015em}
  .desc{fill:#3f3f3f;font-size:13px}
  .meta{fill:#595959;font-size:11.5px}
  .trace{fill:none;stroke-width:1.3;stroke-opacity:.5;stroke-linecap:round;stroke-linejoin:round}
  .ret{stroke-dasharray:6 6}
  .flow{fill:none;stroke-width:2;stroke-dasharray:2 10;stroke-linecap:round;animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-24}}
  .port{fill:#f3f3f1;stroke-width:1.5}
  .token{fill:#161616;filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}
  .rot{font-size:12px;font-weight:500}
  .leg{fill:#3f3f3f;font-size:12px;font-weight:500}
  .cen{fill:#3f3f3f;font-size:12.5px}
  .cen b,.cen .n{fill:#161616;font-weight:600}
  @media (prefers-reduced-motion:reduce){.flow{animation:none}.token{display:none}}
</style>
<defs><pattern id="grade" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d2d2ce"/></pattern></defs>
<rect width="100%" height="100%" fill="#f3f3f1"/><rect width="100%" height="100%" fill="url(#grade)"/>
<text class="titulo" x="48" y="66">Agente com ferramentas e memória</text>
<text class="subt" x="48" y="94">Exemplo da skill. Um pedido do usuário passa pelo planejador, usa ferramentas e volta como resposta.</text>
<g id="arestas">
<g stroke="#6a45d6"><path id="a-pede" class="trace" d="M348,238L468,238"/>
<path class="flow" opacity="0" d="M348,238L468,238"><set attributeName="opacity" to=".95" begin="m1.begin" end="m4.end+0.5s"/><set attributeName="opacity" to=".95" begin="m5.begin" end="m6.end+0.5s"/></path>
</g>
<g stroke="#4450cf"><path id="a-chama" class="trace" d="M768,205L784,205Q796,205 796,193L796,193Q796,181 808,181L888,181"/>
<path class="flow" opacity="0" d="M768,205L784,205Q796,205 796,193L796,193Q796,181 808,181L888,181"><set attributeName="opacity" to=".95" begin="m2.begin" end="m4.end+0.5s"/></path>
</g>
<g stroke="#4450cf"><path id="a-volta" class="trace ret" d="M888,227L768,227"/>
<path class="flow" opacity="0" d="M888,227L768,227"><set attributeName="opacity" to=".95" begin="m3.begin" end="m4.end+0.5s"/></path>
</g>
<g stroke="#0b7f6b"><path id="a-lembra" class="trace" d="M768,248L796,248Q810,248 810,262L810,350Q810,364 824,364L888,364"/>
<path class="flow" opacity="0" d="M768,248L796,248Q810,248 810,262L810,350Q810,364 824,364L888,364"><set attributeName="opacity" to=".95" begin="m4.begin" end="m4.end+0.5s"/></path>
</g>
<g stroke="#6a45d6"><path id="a-revisa" class="trace ret" d="M768,270L782,270Q796,270 796,284L796,485Q796,499 810,499L888,499"/>
<path class="flow" opacity="0" d="M768,270L782,270Q796,270 796,284L796,485Q796,499 810,499L888,499"><set attributeName="opacity" to=".95" begin="m6.begin" end="m6.end+0.5s"/></path>
</g>
</g>
<g id="cards">
