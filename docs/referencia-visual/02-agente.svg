<g stroke="#4450cf"><circle class="port" cx="768" cy="205" r="3.4"/><circle class="port" cx="888" cy="181" r="3.4"/></g>
<rect x="793.9" y="218" width="68.2" height="18" rx="6" fill="#f3f3f1"/><text class="rot" x="828" y="231" text-anchor="middle" fill="#4450cf">resultado</text>
<g stroke="#4450cf"><circle class="port" cx="888" cy="227" r="3.4"/><circle class="port" cx="768" cy="227" r="3.4"/></g>
<path d="M-13,-4 L-6,0 L-13,4" fill="none" stroke="#4450cf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(768,227) rotate(180)"/>
<rect x="786.2" y="297" width="47.6" height="18" rx="6" fill="#f3f3f1"/><text class="rot" x="810" y="310" text-anchor="middle" fill="#0b7f6b">grava</text>
<g stroke="#0b7f6b"><circle class="port" cx="768" cy="248" r="3.4"/><circle class="port" cx="888" cy="364" r="3.4"/></g>
<g stroke="#6a45d6"><circle class="port" cx="768" cy="270" r="3.4"/><circle class="port" cx="888" cy="499" r="3.4"/></g>
</g>
<g id="requisicao">
<circle class="token" r="3.4" opacity="0"><set attributeName="opacity" to="1" begin="m1.begin" end="m1.end"/><animateMotion id="m1" dur="0.38s" begin="0.5s;m6.end+1.1s" calcMode="linear"><mpath href="#a-pede"/></animateMotion></circle>
<circle class="token" r="3.4" opacity="0"><set attributeName="opacity" to="1" begin="m2.begin" end="m2.end"/><animateMotion id="m2" dur="0.45s" begin="m1.end+0.25s" calcMode="linear"><mpath href="#a-chama"/></animateMotion></circle>
<circle class="token" r="3.4" opacity="0"><set attributeName="opacity" to="1" begin="m3.begin" end="m3.end"/><animateMotion id="m3" dur="0.38s" begin="m2.end+0.25s" calcMode="linear"><mpath href="#a-volta"/></animateMotion></circle>
<circle class="token" r="3.4" opacity="0"><set attributeName="opacity" to="1" begin="m4.begin" end="m4.end"/><animateMotion id="m4" dur="0.74s" begin="m3.end+0.25s" calcMode="linear"><mpath href="#a-lembra"/></animateMotion></circle>
<circle class="token" r="3.4" opacity="0"><set attributeName="opacity" to="1" begin="m5.begin" end="m5.end"/><animateMotion id="m5" dur="0.38s" begin="m4.end+1.1s" calcMode="linear"><mpath href="#a-pede"/></animateMotion></circle>
<circle class="token" r="3.4" opacity="0"><set attributeName="opacity" to="1" begin="m6.begin" end="m6.end"/><animateMotion id="m6" dur="1.09s" begin="m5.end+0.25s" calcMode="linear"><mpath href="#a-revisa"/></animateMotion></circle>
</g>
<g id="legenda">
