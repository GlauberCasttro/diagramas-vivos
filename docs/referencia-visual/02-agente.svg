<rect x="66" y="209" width="30" height="30" rx="10" fill="#1f7ac4" fill-opacity=".13"/>
<path transform="translate(66,209)" d="M15 14a3 3 0 1 0 0-6a3 3 0 1 0 0 6 M9 22c0-4.5 12-4.5 12 0" fill="none" stroke="#1f7ac4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
