<text class="leg" x="503.1" y="596">proposto</text>
<text class="cen" x="48" y="632" opacity=".55"><tspan class="n">1. Pedido com uso de ferramenta</tspan><tspan>:  Usuário  →  Planejador  →  Ferramentas  →  Planejador  →  Memória</tspan><set attributeName="opacity" to="1" begin="m1.begin" end="m4.end+0.5s"/></text>
<text class="cen" x="48" y="654" opacity=".55"><tspan class="n">2. Resposta revisada</tspan><tspan>:  Usuário  →  Planejador  →  Revisor</tspan><set attributeName="opacity" to="1" begin="m5.begin" end="m6.end+0.5s"/></text>
