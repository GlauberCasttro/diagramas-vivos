<script>
/* Tema: roda antes de desenhar para não piscar a cor errada. "auto" segue o aparelho. */
(() => {
  const KEY = 'diagramas-vivos-tema', root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)');
  let mem = 'auto';
  const valid = (v) => v === 'auto' || v === 'light' || v === 'dark';
  const get = () => { try { const v = localStorage.getItem(KEY); if (valid(v)) return v; } catch (e) {} return mem; };
  const apply = () => {
    const c = get();
    root.setAttribute('data-theme', c === 'auto' ? (mq.matches ? 'light' : 'dark') : c);
    window.dispatchEvent(new Event('diagramas-vivos-tema'));
  };
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply);
  addEventListener('storage', (e) => { if (e.key === KEY || e.key === null) apply(); });
  window.diagramasVivosTema = { get, set: (c) => {
    if (!valid(c)) return;
    mem = c; try { localStorage.setItem(KEY, c); } catch (e) {}
    apply();
  } };
})();
</script>
